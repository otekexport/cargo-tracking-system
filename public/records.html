<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Cargo Records - Otek Export System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #05131f, #0b253a, #113856);
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.96);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0;
            color: #0b253a;
        }
        .search-box {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 300px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-refresh {
            background: #17a2b8;
            color: white;
        }
        .btn-back {
            background: #6c757d;
            color: white;
            text-decoration: none;
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .delete-btn:hover {
            background: #bd2130;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>📦 All Cargo Records</h2>
        <div>
            <button class="btn btn-refresh" onclick="loadRecords()">🔄 Refresh Data</button>
            <a href="/" class="btn-back">← Back to Dashboard</a>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Search Invoice, Name, Warehouse..." onkeyup="filterTable()">

    <table>
        <thead>
            <tr>
                <th>Arrival Date</th>
                <th>Clearing Warehouse</th>
                <th>Invoice Number</th>
                <th>Customer Name</th>
                <th>Amount (JPY)</th>
                <th>Status</th>
                <th>Destination</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="recordsTableBody">
            <tr>
                <td colspan="8" style="text-align: center;">Loading records...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let allShipments = [];

    async function loadRecords() {
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Loading records...</td></tr>';

        try {
            const res = await fetch('/api/admin/records');
            const result = await res.json();

            if (result.success && Array.isArray(result.data)) {
                allShipments = result.data;
                renderTable(allShipments);
            } else {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">No data found in database.</td></tr>';
            }
        } catch (err) {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">Error connecting to server.</td></tr>';
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('recordsTableBody');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No records found.</td></tr>';
            return;
        }

        let html = '';
        data.forEach(item => {
            const amountVal = item.amount ? '¥ ' + parseInt(item.amount).toLocaleString() : '¥ 0';
            html += `
                <tr>
                    <td>${item.arrival_date || '-'}</td>
                    <td>${item.clearing_warehouse || '-'}</td>
                    <td><strong>${item.invoice_number || '-'}</strong></td>
                    <td>${item.customer_name || '-'}</td>
                    <td>${amountVal}</td>
                    <td><span style="background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-weight: bold;">${item.status || '-'}</span></td>
                    <td>${item.destination || '-'}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteRecord('${item.invoice_number}')">Delete</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allShipments.filter(item => {
            return (item.invoice_number && item.invoice_number.toLowerCase().includes(query)) ||
                   (item.customer_name && item.customer_name.toLowerCase().includes(query)) ||
                   (item.clearing_warehouse && item.clearing_warehouse.toLowerCase().includes(query)) ||
                   (item.destination && item.destination.toLowerCase().includes(query));
        });
        renderTable(filtered);
    }

    async function deleteRecord(invoiceNumber) {
        const adminPassword = sessionStorage.getItem('adminPassword') || prompt('Enter Admin Password to delete:');
        if (!adminPassword) return;

        if (!confirm(`Are you sure you want to delete Invoice ${invoiceNumber}?`)) return;

        try {
            const res = await fetch('/api/admin/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    admin_password: adminPassword,
                    invoice_number: invoiceNumber
                })
            });

            const result = await res.json();
            if (result.success) {
                alert(result.message);
                loadRecords();
            } else {
                alert('Delete failed: ' + result.message);
            }
        } catch (err) {
            alert('Server error during deletion.');
        }
    }

    window.onload = loadRecords;
</script>

</body>
</html>
