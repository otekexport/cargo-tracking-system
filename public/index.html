<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otek Express - Cargo Tracking System</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background-color: #eef2f5; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        .container { 
            max-width: 650px; 
            margin: 20px auto; 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            overflow: hidden; 
        }
        .header { 
            background: #0f172a; 
            color: #ffffff; 
            padding: 25px; 
            text-align: center; 
        }
        .header h1 { 
            margin: 0; 
            font-size: 22px; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
        }
        .header p { 
            margin: 5px 0 0; 
            font-size: 13px; 
            color: #94a3b8; 
        }
        .search-section { 
            padding: 25px; 
            border-bottom: 1px solid #f1f5f9; 
        }
        .search-box { 
            display: flex; 
            gap: 10px; 
        }
        .search-box input { 
            flex: 1; 
            padding: 14px; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 15px; 
            outline: none; 
            transition: border-color 0.2s; 
        }
        .search-box input:focus { 
            border-color: #2563eb; 
        }
        .search-box button { 
            background: #2563eb; 
            color: #fff; 
            border: none; 
            padding: 0 24px; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .search-box button:hover { 
            background: #1d4ed8; 
        }
        .error-msg { 
            display: none; 
            color: #dc2626; 
            background: #fef2f2; 
            border: 1px solid #fecaca; 
            padding: 12px; 
            border-radius: 8px; 
            margin-top: 15px; 
            font-size: 14px; 
            text-align: center; 
        }
        .tracking-result { 
            display: none; 
            padding: 25px; 
        }
        .status-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 2px dashed #e2e8f0; 
        }
        .tracking-no { 
            font-size: 18px; 
            font-weight: 700; 
            color: #0f172a; 
        }
        .status-badge { 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 700; 
            background: #dbeafe; 
            color: #1e40af; 
            text-transform: uppercase; 
        }
        .info-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .info-item { 
            background: #f8fafc; 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 1px solid #f1f5f9; 
        }
        .info-item label { 
            display: block; 
            font-size: 12px; 
            color: #64748b; 
            font-weight: 600; 
            margin-bottom: 4px; 
            text-transform: uppercase; 
        }
        .info-item span { 
            font-size: 14px; 
            color: #1e293b; 
            font-weight: 600; 
        }
        .payment-box { 
            background: #f0fdf4; 
            border: 1px solid #bbf7d0; 
            padding: 18px; 
            border-radius: 10px; 
            margin-top: 20px; 
            text-align: center; 
        }
        .payment-box .amount-label { 
            font-size: 13px; 
            color: #166534; 
            font-weight: 600; 
        }
        .payment-box .amount-value { 
            font-size: 24px; 
            color: #15803d; 
            font-weight: 800; 
            margin: 5px 0 15px; 
        }
        .pay-btn { 
            display: none; 
            width: 100%; 
            background: #635bff; 
            color: #ffffff; 
            border: none; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s; 
        }
        .pay-btn:hover { 
            background: #4f46e5; 
            transform: translateY(-1px); 
        }
        .pay-btn:active { 
            transform: translateY(0); 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🚢 Otek Logistics Express</h1>
        <p>Real-Time Cargo Tracking & Online Payment Portal</p>
    </div>

    <!-- Tracking Search Box -->
    <div class="search-section">
        <div class="search-box">
            <input type="text" id="trackingInput" placeholder="Enter Tracking Number (e.g. OTK-98421)">
            <button onclick="trackCargo()">Track Cargo</button>
        </div>
        <div id="errorMsg" class="error-msg">Tracking number not found. Please check and try again.</div>
    </div>

    <!-- Tracking Details Result Card -->
    <div id="trackingResult" class="tracking-result">
        <div class="status-header">
            <div>
                <div style="font-size: 12px; color: #64748b; font-weight: bold;">TRACKING NO</div>
                <div class="tracking-no" id="resTrackingNo">-</div>
            </div>
            <div class="status-badge" id="resStatus">IN TRANSIT</div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <label>Route / Destination</label>
                <span id="resRoute">Japan ➔ Sri Lanka</span>
            </div>
            <div class="info-item">
                <label>Cargo Type</label>
                <span id="resCargoDetails">Personal Baggage</span>
            </div>
            <div class="info-item">
                <label>Sender</label>
                <span id="resSender">Otek Export Co.</span>
            </div>
            <div class="info-item">
                <label>Receiver</label>
                <span id="resReceiver">Consignee</span>
            </div>
        </div>

        <!-- Payment Action Box -->
        <div class="payment-box">
            <div class="amount-label">PENDING SHIPPING & CLEARANCE FEE</div>
            <div class="amount-value" id="resAmount">¥ 0</div>
            <button id="payNowBtn" class="pay-btn" onclick="goToPaymentPage()">Pay Now via Stripe (ගෙවීම් කරන්න)</button>
        </div>
    </div>
</div>

<script>
    let currentTracking = '';
    let currentAmount = 0;

    async function trackCargo() {
        const trackingNo = document.getElementById('trackingInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const trackingResult = document.getElementById('trackingResult');
        const payBtn = document.getElementById('payNowBtn');

        if (!trackingNo) {
            alert('Please enter a tracking number.');
            return;
        }

        try {
            const response = await fetch(`/api/track/${encodeURIComponent(trackingNo)}`);
            if (!response.ok) {
                throw new Error('Not found');
            }

            const data = await response.json();

            currentTracking = data.trackingNumber || trackingNo;
            currentAmount = data.amountDue || 0;

            document.getElementById('resTrackingNo').innerText = currentTracking;
            document.getElementById('resStatus').innerText = data.status || 'IN TRANSIT';
            document.getElementById('resRoute').innerText = data.route || 'Japan ➔ Sri Lanka';
            document.getElementById('resCargoDetails').innerText = data.cargoDetails || 'Standard Package';
            document.getElementById('resSender').innerText = data.sender || 'Otek Export Co., Ltd';
            document.getElementById('resReceiver').innerText = data.receiver || 'Consignee';
            document.getElementById('resAmount').innerText = '¥ ' + parseInt(currentAmount).toLocaleString();

            errorMsg.style.display = 'none';
            trackingResult.style.display = 'block';

            // ගෙවීමට මුදලක් ඇත්නම් පමණක් Pay Now බටන් එක පෙන්වීම
            if (currentAmount > 0) {
                payBtn.style.display = 'block';
            } else {
                payBtn.style.display = 'none';
            }

        } catch (err) {
            trackingResult.style.display = 'none';
            payBtn.style.display = 'none';
            errorMsg.style.display = 'block';
        }
    }

    function goToPaymentPage() {
        if (currentTracking && currentAmount > 0) {
            // වෙනම ඇති payment.html එකට Redirect කිරීම
            window.location.href = `/payment.html?tracking=${encodeURIComponent(currentTracking)}&amount=${currentAmount}`;
        }
    }
</script>

</body>
</html>
