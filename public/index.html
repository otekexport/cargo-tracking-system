<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otek Export Cargo System</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(135deg, #05131f, #0b253a, #113856);
            overflow-x: hidden;
        }

        /* Canvas Background for Falling Gold Stars */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .card { 
            background: rgba(255, 255, 255, 0.96); 
            backdrop-filter: blur(10px);
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(255, 215, 0, 0.15); 
            width: 92%; 
            max-width: 1000px;
            text-align: left; 
            margin-top: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .nav-buttons { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .nav-btn { background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #666; padding: 10px 18px; }
        .nav-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-top: 12px; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 12px; margin: 6px 0 12px 0; font-size: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button.submit-btn { width: 100%; padding: 12px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button.admin-btn { background: #007bff; }
        button.bulk-btn { background: #6f42c1; }
        button.delete-btn { background: #dc3545; }
        button.view-page-btn { background: #17a2b8; }
        .section-divider { border-top: 1px solid #ddd; margin: 25px 0; }
        
        #result { margin-top: 18px; font-size: 15px; line-height: 1.6; word-break: break-word; }
        .result-box {
            background: #f8f9fa;
            border-left: 5px solid #28a745;
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .result-item {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .result-item strong {
            color: #0b253a;
        }

        .brand-logo {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
        }

        /* Bank & Slip Section Styling */
        .bank-card {
            margin-top: 20px;
            padding: 18px;
            background: #f0f7ff;
            border: 1px solid #b8daff;
            border-radius: 12px;
        }
        .bank-details-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d6e9c6;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.7;
        }

        /* WhatsApp Section Styling */
        .whatsapp-card {
            margin-top: 20px;
            padding: 18px;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 12px;
            text-align: center;
        }
        .whatsapp-buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 12px 0;
        }
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #25D366;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: background 0.3s, transform 0.2s;
        }
        .whatsapp-btn:hover {
            background: #1eb854;
            transform: translateY(-2px);
        }
        .time-notice {
            font-size: 13px;
            color: #1b5e20;
            line-height: 1.6;
            text-align: left;
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #25D366;
            margin-top: 10px;
        }

        #msg, #loginMsg, #bulkMsg, #deleteMsg, #slipMsg { margin-top: 12px; font-weight: bold; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Falling Gold Stars Canvas Background -->
    <canvas id="starCanvas"></canvas>

    <div class="card">
        <!-- Navigation Tabs -->
        <div class="nav-buttons">
            <button class="nav-btn active" id="btn-customer" onclick="switchTab('customer')">📦 Track Cargo</button>
            <button class="nav-btn" id="btn-admin" onclick="switchTab('admin')">🛠️ Admin Panel</button>
        </div>

        <!-- Tab 1: Customer View -->
        <div id="customer" class="tab-content active">
            <!-- Otek Export Logo -->
            <img src="logo.png" alt="Otek Export Logo" class="brand-logo" onerror="this.style.display='none'">

            <h3 style="margin-top:0; color:#28a745; text-align: center;">Otek Export Customer Tracking</h3>
            <label>Invoice Number:</label>
            <input type="text" id="invoice" placeholder="e.g. INV-1001">
            <button class="submit-btn" onclick="track()">Track Status</button>
            <div id="result"></div>
        </div>

        <!-- Tab 2: Admin View -->
        <div id="admin" class="tab-content">
            <h3 style="margin-top:0; color:#007bff; text-align: center;">Admin Panel</h3>
            
            <!-- Login Form -->
            <div id="adminLoginForm">
                <label>Admin Password:</label>
                <input type="password" id="adminPassword" placeholder="Enter Password">
                <button class="submit-btn admin-btn" onclick="verifyPassword()">Login to Admin</button>
                <div id="loginMsg"></div>
            </div>

            <!-- Admin Forms -->
            <div id="adminUpdateForm" style="display: none;">
                <!-- Full Table Page Button -->
                <h4 style="margin: 0 0 5px 0; color: #17a2b8;">View & Manage Database</h4>
                <button class="submit-btn view-page-btn" onclick="openRecordsPage()">📂 Open All Records in New Page</button>

                <div class="section-divider"></div>

                <!-- Single Cargo Update -->
                <h4 style="margin: 0 0 5px 0;">Single Cargo Update</h4>
                <label>Arrival Date:</label>
                <input type="text" id="arrivalDate" placeholder="e.g. October 20, 2026">
                <label>Clearing Warehouse:</label>
                <input type="text" id="clearingWarehouse" placeholder="e.g. Laksiri Warehouse in Peliyagoda">
                <label>Invoice Number:</label>
                <input type="text" id="inv" placeholder="INV-1001">
                <label>Customer Name:</label>
                <input type="text" id="name" placeholder="Kamal Perera">
                <label>Status:</label>
                <input type="text" id="status" placeholder="In Transit / Delivered">
                <label>Destination:</label>
                <input type="text" id="dest" placeholder="Colombo">
                <button class="submit-btn admin-btn" onclick="updateShipment()">Save Single Status</button>
                <div id="msg"></div>

                <div class="section-divider"></div>

                <!-- Delete Cargo Section -->
                <h4 style="margin: 0 0 5px 0; color: #dc3545;">Delete Cargo Record</h4>
                <label>Invoice Number to Delete:</label>
                <input type="text" id="deleteInv" placeholder="e.g. INV-1001">
                <button class="submit-btn delete-btn" onclick="deleteShipment()">Delete Record</button>
                <div id="deleteMsg"></div>

                <div class="section-divider"></div>

                <!-- Bulk CSV Upload -->
                <h4 style="margin: 0 0 5px 0;">Bulk Upload (CSV File)</h4>
                <label>Select CSV File:</label>
                <input type="file" id="csvFile" accept=".csv">
                <button class="submit-btn bulk-btn" onclick="uploadCSV()">Upload Bulk CSV</button>
                <div id="bulkMsg"></div>

                <div class="section-divider"></div>
                <button style="background: #6c757d; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;" onclick="logoutAdmin()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        // 🌟 Falling Gold Stars Animation Logic
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createStars() {
            stars = [];
            const count = Math.floor(window.innerWidth / 12);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.5 + 1,
                    speedY: Math.random() * 1.2 + 0.3,
                    speedX: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random(),
                    fadeSpeed: Math.random() * 0.02 + 0.005,
                    color: Math.random() > 0.3 ? '#FFD700' : '#FFF8DC' // Gold and Warm Glow
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.globalAlpha = s.opacity;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#FFD700';
                ctx.fill();
                ctx.restore();

                s.y += s.speedY;
                s.x += s.speedX;
                s.opacity += s.fadeSpeed;

                if (s.opacity >= 1 || s.opacity <= 0.2) {
                    s.fadeSpeed = -s.fadeSpeed;
                }

                if (s.y > canvas.height) {
                    s.y = -10;
                    s.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawStars);
        }

        createStars();
        drawStars();

        // System Variables & Logic
        let currentAdminPassword = "";

        const WHATSAPP_NUMBER_1 = "94740784400";
        const WHATSAPP_NUMBER_2 = "94740304400";
        const WHATSAPP_NUMBER_3 = "94740104400";

        function switchTab(tabName) {
            document.getElementById('customer').classList.remove('active');
            document.getElementById('admin').classList.remove('active');
            document.getElementById('btn-customer').classList.remove('active');
            document.getElementById('btn-admin').classList.remove('active');
            
            document.getElementById(tabName).classList.add('active');
            document.getElementById('btn-' + tabName).classList.add('active');
        }

        async function track() {
            const inv = document.getElementById('invoice').value.trim();
            if (!inv) return alert('Please enter Invoice Number');
            const res = await fetch('/api/track/' + inv);
            const data = await res.json();
            const div = document.getElementById('result');
            if(data.success) {
                let slipStatusText = "";
                if (data.data.payment_slip) {
                    slipStatusText = `<div style="background:#d4edda; color:#155724; padding:10px; border-radius:6px; margin-top:10px; font-weight:bold; text-align:center;">
                        ✅ Payment Slip Uploaded & Being Verified
                    </div>`;
                }

                div.innerHTML = `
                    <div class="result-box">
                        <div class="result-item"><strong>Arrival Date:</strong> ${data.data.arrival_date || '-'}</div>
                        <div class="result-item"><strong>Clearing Warehouse:</strong> ${data.data.clearing_warehouse || '-'}</div>
                        <div class="result-item"><strong>Invoice Number:</strong> ${data.data.invoice_number || '-'}</div>
                        <div class="result-item"><strong>Customer Name:</strong> ${data.data.customer_name || '-'}</div>
                        <div class="result-item"><strong>Status:</strong> ${data.data.status || '-'}</div>
                        <div class="result-item"><strong>Destination:</strong> ${data.data.destination || '-'}</div>
                    </div>

                    <!-- Bank Details & Payment Slip Upload Box -->
                    <div class="bank-card">
                        <h4 style="margin:0 0 10px 0; color:#004085;">🏦 Bank Transfer Details & Receipt Upload</h4>
                        
                        <div class="bank-details-box">
                            <b>Bank Name:</b> Commercial Bank PLC<br>
                            <b>Account Name:</b> Otek Export / Panorama Cargo Logistics<br>
                            <b>Account Number:</b> 1234 5678 9012<br>
                            <b>Branch:</b> Colombo Main Branch
                        </div>

                        ${slipStatusText}

                        <label style="margin-top:12px;">📤 Upload Your Bank Payment Slip / Receipt:</label>
                        <input type="file" id="slipInput" accept="image/*,.pdf">
                        <button class="submit-btn" style="background:#007bff;" onclick="uploadSlip('${data.data.invoice_number}')">
                            Upload Bank Receipt
                        </button>
                        <div id="slipMsg"></div>
                    </div>

                    <!-- WhatsApp 3 Lines Contact Box -->
                    <div class="whatsapp-card">
                        <h4 style="margin:0 0 8px 0; color:#1b5e20;">💬 Contact Sri Lanka Office (WhatsApp)</h4>
                        
                        <div class="whatsapp-buttons-container">
                            <a href="https://wa.me/${WHATSAPP_NUMBER_1}" target="_blank" class="whatsapp-btn">
                                📞 Line 1: +94 74 078 4400
                            </a>
                            <a href="https://wa.me/${WHATSAPP_NUMBER_2}" target="_blank" class="whatsapp-btn">
                                📞 Line 2: +94 74 030 4400
                            </a>
                            <a href="https://wa.me/${WHATSAPP_NUMBER_3}" target="_blank" class="whatsapp-btn">
                                📞 Line 3: +94 74 010 4400
                            </a>
                        </div>

                        <div class="time-notice">
                            📌 <b>සිංහල:</b> කරුණාකර සතියේ වැඩකරන දිනයන්හි පෙ.ව. 8:30 සිට ප.ව. 5:00 දක්වා වේලාවන් තුළ අමතන්න.<br>
                            📌 <b>English:</b> Please call on working days from 8:30 AM to 5:00 PM.<br>
                            📌 <b>தமிழ்:</b> தயவுசெய்து வேலை நாட்களில் காலை 8:30 மணி முதல் மாலை 5:00 மணி வரை தொடர்புகொள்ளவும்.
                        </div>
                    </div>
                `;
            } else {
                div.innerHTML = "<p style='color:red; text-align:center; padding:10px;'>" + data.message + "</p>";
            }
        }

        async function uploadSlip(invoiceNum) {
            const fileInput = document.getElementById('slipInput');
            const file = fileInput.files[0];
            if (!file) return alert('Please select a payment slip image first!');

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result;
                const res = await fetch('/api/upload-slip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        invoice_number: invoiceNum,
                        slip_base64: base64Data
                    })
                });

                const result = await res.json();
                const slipMsg = document.getElementById('slipMsg');
                if (result.success) {
                    slipMsg.style.color = "green";
                    slipMsg.innerText = result.message;
                    fileInput.value = "";
                } else {
                    slipMsg.style.color = "red";
                    slipMsg.innerText = result.message || "Slip upload failed!";
                }
            };
            reader.readAsDataURL(file);
        }

        function verifyPassword() {
            const pass = document.getElementById('adminPassword').value;
            if(!pass) return alert('Please enter password');

            currentAdminPassword = pass;
            sessionStorage.setItem('adminPassword', pass);
            document.getElementById('adminLoginForm').style.display = 'none';
            document.getElementById('adminUpdateForm').style.display = 'block';
            document.getElementById('loginMsg').innerText = '';
        }

        function logoutAdmin() {
            currentAdminPassword = "";
            sessionStorage.removeItem('adminPassword');
            document.getElementById('adminPassword').value = "";
            document.getElementById('adminLoginForm').style.display = 'block';
            document.getElementById('adminUpdateForm').style.display = 'none';
        }

        function openRecordsPage() {
            window.open('/records.html', '_blank');
        }

        async function updateShipment() {
            const data = {
                admin_password: currentAdminPassword,
                arrival_date: document.getElementById('arrivalDate').value,
                clearing_warehouse: document.getElementById('clearingWarehouse').value,
                invoice_number: document.getElementById('inv').value,
                customer_name: document.getElementById('name').value,
                status: document.getElementById('status').value,
                destination: document.getElementById('dest').value
            };

            if(!data.invoice_number) return alert('Enter Invoice Number');

            const res = await fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            const msgDiv = document.getElementById('msg');
            if(result.success) {
                msgDiv.style.color = "green";
                msgDiv.innerText = result.message;
            } else {
                msgDiv.style.color = "red";
                msgDiv.innerText = result.message || "Error updating shipment!";
                if(result.message === 'Invalid Admin Password!') logoutAdmin();
            }
        }

        async function deleteShipment() {
            const inv = document.getElementById('deleteInv').value.trim();
            if(!inv) return alert('Please enter Invoice Number to delete');

            if(!confirm(`Are you sure you want to delete Invoice ${inv}?`)) return;

            const res = await fetch('/api/admin/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    admin_password: currentAdminPassword,
                    invoice_number: inv
                })
            });

            const result = await res.json();
            const deleteMsg = document.getElementById('deleteMsg');
            if(result.success) {
                deleteMsg.style.color = "green";
                deleteMsg.innerText = result.message;
                document.getElementById('deleteInv').value = "";
            } else {
                deleteMsg.style.color = "red";
                deleteMsg.innerText = result.message || "Error deleting shipment!";
                if(result.message === 'Invalid Admin Password!') logoutAdmin();
            }
        }

        function uploadCSV() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            if (!file) return alert('Please select a CSV file first!');

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/);
                    const shipments = [];

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        
                        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"\vert{}"$/g, ''));

                        if (cols.length >= 4) {
                            if (cols.length >= 6 || isNaN(Number(cols[0]))) {
                                if (cols[2]) {
                                    shipments.push({
                                        arrival_date: cols[0] || '',
                                        clearing_warehouse: cols[1] || '',
                                        invoice_number: cols[2] || '',
                                        customer_name: cols[3] || '',
                                        status: cols[4] || '',
                                        destination: cols[5] || ''
                                    });
                                }
                            } else {
                                if (cols[0]) {
                                    shipments.push({
                                        arrival_date: '',
                                        clearing_warehouse: '',
                                        invoice_number: cols[0] || '',
                                        customer_name: cols[1] || '',
                                        status: cols[2] || '',
                                        destination: cols[3] || ''
                                    });
                                }
                            }
                        }
                    }

                    if (shipments.length === 0) return alert('No valid data found in CSV!');

                    const res = await fetch('/api/admin/bulk-update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            admin_password: currentAdminPassword,
                            shipments: shipments
                        })
                    });

                    const result = await res.json();
                    const bulkMsg = document.getElementById('bulkMsg');
                    if(result.success) {
                        bulkMsg.style.color = "green";
                        bulkMsg.innerText = result.message;
                        fileInput.value = "";
                    } else {
                        bulkMsg.style.color = "red";
                        bulkMsg.innerText = result.message || "Bulk update failed!";
                        if(result.message === 'Invalid Admin Password!') logoutAdmin();
                    }
                } catch (err) {
                    alert('CSV file read error: ' + err.message);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
